<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0d0918">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bowl Bandit">

<title>Bowl Bandit</title>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<body>
<div id="stage"><canvas id="c"></canvas></div>
<script src="src/version.js"></script>
<script src="src/core.js"></script>
<script src="src/game.js"></script>
<script>
  /* offline play once installed; skipped when opened as a file.
     updateViaCache 'none' so the worker script itself is always checked
     against the server: an old worker is what keeps an old build alive. */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
  }
</script>
</body>
</html>
